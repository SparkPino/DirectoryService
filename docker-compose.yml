services:
  backend:
    container_name: backend
    image: directory-service-backend:dev
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    build:
      context: ./DirectoryService
      dockerfile: src/DirectoryService.Web/Dockerfile
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN}
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DirectoryServiceDb: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Serilog__WriteTo__1__Args__serverUrl: "http://seq:5341"
    depends_on:
      migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      seq:
        condition: service_started
  postgres:
    container_name: postgres
    image: postgres:16
    restart: always
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
  seq:
    container_name: seq
    image: datalust/seq:2024.3
    restart: always
    environment:
      ACCEPT_EULA: Y
    ports:
      - "5341:5341"
      - "8081:80"
    volumes:
      - seq-data:/data
  nginx:
    container_name: nginx-directory-service
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
  frontend:
    container_name: frontend
    image: directory-service-frontend:dev
    build:
      context: ./directory-service-client
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/}
    restart: always
  migrator:
    container_name: migrator
    image: directory-service-migrator:dev
    build:
      context: ./DirectoryService
      target: migrator
      dockerfile: src/DirectoryService.Web/Dockerfile
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN}
    command:
      [
        "--connection",
        "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}",
      ]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres-data:
  seq-data:
